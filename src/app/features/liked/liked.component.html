<main class="liked-page" id="main-content">
  <header class="liked-header">
    <h1 class="page-title">Liked Songs</h1>
    <p class="track-count">{{ likedStore.likedCount() }} tracks</p>
  </header>

  @if (likedStore.hasAny()) {
    <ul class="track-list" role="list">
      @for (track of likedStore.liked(); track track.id; let i = $index) {
        <li>
          <app-track-card [track]="track" [trackNumber]="i + 1" />
        </li>
      }
    </ul>
  } @else {
    <div class="empty-state">
      <p class="empty-icon">♡</p>
      <p>No liked songs yet</p>
      <p class="empty-sub">Tap the heart on any track to save it here</p>
    </div>
  }
</main>
