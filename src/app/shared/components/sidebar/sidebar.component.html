<aside
  class="sidebar"
  [class.sidebar--collapsed]="isCollapsed()"
  aria-label="Library"
>
  <button
    type="button"
    class="collapse-btn"
    (click)="toggleCollapsed()"
    [attr.aria-label]="isCollapsed() ? 'Expand library' : 'Collapse library'"
    [attr.aria-expanded]="!isCollapsed()"
  >
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
      <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
    </svg>
    @if (!isCollapsed()) {
      <span>Your Library</span>
    }
  </button>

  @if (!isCollapsed()) {
    <nav aria-label="Library navigation">
      <a routerLink="/liked" routerLinkActive="active" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
        <span>Liked Songs <small>({{ likedStore.likedCount() }})</small></span>
      </a>

      <a routerLink="/playlists" routerLinkActive="active" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/>
          <line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>
        </svg>
        <span>All Playlists</span>
      </a>

      @for (playlist of playlistStore.playlists(); track playlist.id) {
        <a
          [routerLink]="['/playlists']"
          [queryParams]="{ id: playlist.id }"
          routerLinkActive="active"
          class="sidebar-link sidebar-link--playlist"
        >
          <span class="playlist-icon" aria-hidden="true">♪</span>
          <span class="playlist-name">{{ playlist.name }}</span>
        </a>
      }
    </nav>
  }
</aside>
